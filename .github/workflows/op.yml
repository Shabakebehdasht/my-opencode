name: open1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      REPO_ORIGIN: https://github.com/haileen5/h-dashboard.git
      WF_NAME: open1

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 2. Setup OpenSSH Server & Set Runner Password
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          echo "runner:${{ secrets.RUNNER_PASSWORD }}" | sudo chpasswd
          sudo sed -i 's/^#PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh
          sudo systemctl enable ssh

      - name: 3. Setup npm, PATH, and Environment Variables Persistently
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          mkdir -p ~/.npm-global
          npm config set prefix '~/.npm-global'

          echo 'export PATH="$HOME/.npm-global/bin:$PATH"' >> ~/.bashrc
          echo 'export PATH="$HOME/.npm-global/bin:$PATH"' >> ~/.profile
          export PATH="$HOME/.npm-global/bin:$PATH"

          echo "export GH_TOKEN=$GH_TOKEN" >> ~/.bashrc
          echo "export GH_TOKEN=$GH_TOKEN" >> ~/.profile
          echo "GH_TOKEN=$GH_TOKEN" | sudo tee -a /etc/environment

          echo 'export INITIAL_PASSWORD="${{ secrets.RUNNER_PASSWORD }}"' >> ~/.bashrc
          echo 'export INITIAL_PASSWORD="${{ secrets.RUNNER_PASSWORD }}"' >> ~/.profile
          echo 'INITIAL_PASSWORD="${{ secrets.RUNNER_PASSWORD }}"' | sudo tee -a /etc/environment

          # CodeGraph CLI — installed here, the first step where npm is on PATH.
          # ~/.hermes/config.yaml (restored later) runs
          # ~/.npm-global/bin/codegraph serve --mcp, so this must land before
          # Hermes first runs. The /usr/local/bin symlink keeps the plain
          # `codegraph` command available in every shell.
          npm install -g @colbymchenry/codegraph
          if [ -x ~/.npm-global/bin/codegraph ]; then
            sudo ln -sf ~/.npm-global/bin/codegraph /usr/local/bin/codegraph
            echo "✅ CodeGraph installed: $(/usr/local/bin/codegraph --version)"
          else
            echo '⚠️ CodeGraph binary not found after installation'
          fi

      - name: 4. Install PHP 8.5 & Composer (Laravel + pgsql + redis)
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ondrej/php
          sudo apt-get update
          sudo apt-get install -y \
            php8.5 php8.5-cli php8.5-common php8.5-fpm \
            php8.5-mbstring php8.5-xml php8.5-pgsql php8.5-curl php8.5-zip php8.5-bcmath php8.5-intl php8.5-gd \
            php8.5-redis php8.5-tokenizer php8.5-fileinfo php8.5-ctype \
            unzip
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          sudo php composer-setup.php --install-dir=/usr/local/bin --filename=composer
          php -r "unlink('composer-setup.php');"

      - name: 5. Connect Tailscale as Exit Node & Show Access Info
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="$TAILSCALE_AUTHKEY" --hostname="${{ env.WF_NAME }}" --advertise-exit-node --accept-routes --accept-dns

          # Enable IP forwarding (required for exit node to route traffic)
          echo 'net.ipv4.ip_forward = 1' | sudo tee -a /etc/sysctl.conf
          echo 'net.ipv6.conf.all.forwarding = 1' | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p /etc/sysctl.conf

          TS_IP=$(sudo tailscale ip -4)
          echo "=================================================="
          echo "  >>> SSH & WEB SERVER ARE LIVE! <<<"
          echo "  Tailscale IP  : $TS_IP"
          echo "  Username      : runner"
          echo "  Password      : ${{ secrets.RUNNER_PASSWORD }}"
          echo "  ------------------------------------------------"
          echo "  💻 SSH: ssh runner@$TS_IP"
          echo "  🌐 Web : http://$TS_IP:8000  (Laravel)"
          echo "  🔀 9Router: http://$TS_IP:20128  (dashboard)"
          echo "  🤖 OpenCode: http://$TS_IP:4096  (user: opencode, pass: RUNNER_PASSWORD)"
          echo "  💾 Project: /home/runner/h-dashboard"
          echo "  🌍 Exit Node: Enabled (advertise-exit-node)"
          echo "=================================================="

      - name: 6. Authenticate gh CLI & configure git credential helper
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          unset GH_TOKEN
          echo "${{ secrets.MY_PAT }}" | gh auth login --with-token
          gh auth setup-git
          gh auth status
          echo "✅ GitHub CLI authenticated as: $(gh api user -q .login)"

      - name: 7. Clone / sync h-dashboard and create branch
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          cd /home/runner
          if [ ! -d h-dashboard ]; then
            git clone "$REPO_ORIGIN"
          fi
          cd h-dashboard

          # Set git identity for commits
          git config user.name "haileen5"
          git config user.email "haileen5@users.noreply.github.com"

          # Fetch latest origin/beta
          git fetch origin beta

          # Create / reset WF_NAME branch from origin/beta
          git checkout -B "${WF_NAME}" origin/beta
          echo "✅ Branch ${WF_NAME} created/reset from origin/beta"

          cp .env.example.pgsql .env

          # .hermes.md is not wanted — AGENTS.md is the authoritative instruction
          # file. Drop it from the checkout and from the index (without touching
          # beta), then exclude it so `git status` stays clean.
          if git ls-files --error-unmatch .hermes.md >/dev/null 2>&1; then
            git rm -q --cached .hermes.md
          fi
          rm -f .hermes.md
          grep -qxF '.hermes.md' .git/info/exclude 2>/dev/null \
            || echo '.hermes.md' >> .git/info/exclude
          echo '✅ .hermes.md removed from the checkout and the index'

      - name: 8. Start Docker Compose (PostgreSQL)
        run: |
          cd /home/runner/h-dashboard
          docker compose -f docker-compose-pgsql-.yml up -d
          echo '✅ Docker Compose started'

      - name: 9. Composer, NPM, Optimize, Migrate & Seed
        run: |
          cd /home/runner/h-dashboard
          composer update --no-interaction
          npm update
          php artisan optimize
          php artisan migrate:fresh --seed --force
          echo '✅ Database migrated and seeded'

      - name: 10. Build frontend assets
        run: |
          cd /home/runner/h-dashboard
          npm run build
          echo '✅ Frontend assets built'

      - name: 10b. Index h-dashboard with CodeGraph
        run: |
          cd /home/runner/h-dashboard
          if [ -x /usr/local/bin/codegraph ]; then
            CODEGRAPH_TELEMETRY=0 codegraph init .
            CODEGRAPH_TELEMETRY=0 codegraph status .
            echo '✅ CodeGraph index built for h-dashboard'
          else
            echo '⚠️ CodeGraph not on PATH — skipping index'
          fi

      - name: 11. Install 9router globally and create symlink
        run: |
          npm install -g 9router
          if [ -f ~/.npm-global/bin/9router ]; then
            sudo ln -sf ~/.npm-global/bin/9router /usr/local/bin/9router
            echo '✅ 9router installed and symlinked to /usr/local/bin/9router'
          else
            echo '⚠️ 9router binary not found after installation'
          fi

      - name: 12. Restore 9router db backup & start hidden (tray)
        run: |
          export INITIAL_PASSWORD="${{ secrets.RUNNER_PASSWORD }}"
          # Make sure the data dir exists
          mkdir -p ~/.9router/db
          BACKUP_DIR="${GITHUB_WORKSPACE:-.}/9router"
          # Restore the backed-up state from the repo (committed in 9router/data.sqlite)
          if [ -f "$BACKUP_DIR/data.sqlite" ]; then
            cp "$BACKUP_DIR/data.sqlite" ~/.9router/db/data.sqlite
            echo '✅ Restored 9router data.sqlite from repo backup'
          else
            echo '⚠️ 9router/data.sqlite not found in repo — starting fresh'
          fi
          # Start 9router hidden in the background (tray mode) on the default port 20128.
          # --tray is the same "hide to background" option used interactively.
          nohup 9router --tray --skip-update -p 20128 > /tmp/9router.log 2>&1 &
          sleep 6
          if curl -fsS http://localhost:20128 > /dev/null 2>&1; then
            echo '✅ 9router is live on http://localhost:20128'
          else
            echo '⚠️ 9router did not come up — check /tmp/9router.log'
          fi

      - name: 13. Install Hermes Agent & restore config + MCPs
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_CUSTOM_API_KEY }}
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |

          # 1. Install Hermes Agent
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
          echo '✅ Hermes Agent installed'
          # Make sure uvx (used by the postgis MCP) is on PATH — Hermes ships it under ~/.hermes/bin
          export PATH="$HOME/.hermes/bin:$PATH"

          # 2. Restore hermes state (config, memories, skills, cron, hooks, etc.) from repo
          mkdir -p /home/runner/.hermes
          H="${GITHUB_WORKSPACE:-.}/hermes"
          D=/home/runner/.hermes
          for item in memories skills cron hooks platforms sessions kanban plugins; do
            [ -d "$H/$item" ] && cp -r "$H/$item" "$D/"
          done
          for f in SOUL.md config.yaml kanban.db channel_directory.json \
                   gateway_state.json .skills_prompt_snapshot.json; do
            [ -f "$H/$f" ] && cp "$H/$f" "$D/"
          done
          echo '✅ Restored hermes state from repo (hermes/ → ~/.hermes/)'
          # 3. Write the .env with secrets pulled from GitHub Secrets.
          #    api_key in config.yaml is an env ref (${HERMES_CUSTOM_..._API_KEY}),
          #    so the actual key is supplied here — never committed to the repo.
          #    Telegram is NOT wired up (removed at Mehdi's request): no bot
          #    token or allowed-users are written here, and the messaging
          #    gateway is no longer started (see the note at §7 below).
          {
            echo "HERMES_CUSTOM_127_0_0_1_20128_API_KEY=${HERMES_API_KEY}"
            echo "GITHUB_TOKEN=${GH_TOKEN}"
            echo "HERMES_PEER_AILYN_KEY=${HERMES_API_KEY}"
          } > ~/.hermes/.env
          chmod 600 ~/.hermes/.env
          echo '✅ Wrote ~/.hermes/.env from secrets'

          # 4. Install MCP servers + the shadcn/improve skill.
          #    4a. Laravel Boost MCP (php artisan boost:mcp — provided by laravel/boost)
          #        Must run inside h-dashboard: `composer require` in the workflow's
          #        working dir (the my-op1 workspace) would install the package into
          #        the wrong project and litter composer.json/vendor/ at its root.
          cd /home/runner/h-dashboard
          composer require laravel/boost --no-interaction 2>&1 | tail -3 || true
          if [ -f /home/runner/h-dashboard/artisan ]; then
            php artisan boost:update 2>/dev/null || true
            echo '✅ Laravel Boost package present (MCP: php artisan boost:mcp)'
          fi

          #    4b. shadcn/improve is an AGENT SKILL, not an MCP server.
          npx -y skills add shadcn/improve 2>&1 | tail -3 || true
          echo '✅ shadcn/improve skill added'

          #    4c. Context7 MCP (documentation lookup)
          hermes mcp install context7 2>&1 || true
          echo '✅ Context7 MCP installed'

          #    4d. GitHub MCP Server (issues, PRs, code search via MCP protocol)
          echo "Y" | hermes mcp add github \
            --command npx \
            --args -y @modelcontextprotocol/server-github \
            --env "GITHUB_PERSONAL_ACCESS_TOKEN=$GH_TOKEN" \
            --connect-timeout 60 2>&1 || true
          echo '✅ GitHub MCP Server installed (26 tools: issues, PRs, code search, repos)'

          #    4e. Superpowers plugin — must be INSTALLED here.
          #        This repo has no hermes/plugins/ at all, so the restore in
          #        section 2 copies nothing for it, yet the restored
          #        config.yaml lists superpowers under plugins.enabled —
          #        Hermes looks for a plugin that is not on disk and errors.
          #        Install it fresh from upstream, so it is on disk before first use.
          #        --enable makes it non-interactive (a plain install prompts
          #        'Enable now? [y/N]' and would hang/fail on a runner).
          #        The rm -rf first keeps this idempotent if a partial or
          #        empty plugins/superpowers dir is ever restored later.
          rm -rf ~/.hermes/plugins/superpowers
          hermes plugins install obra/superpowers --enable 2>&1 | tail -5 || true
          if [ ! -f ~/.hermes/plugins/superpowers/.hermes-plugin/plugin.yaml ]; then
            echo '⚠️ hermes plugins install produced no plugin — falling back to git clone'
            rm -rf ~/.hermes/plugins/superpowers
            git clone https://github.com/obra/superpowers.git ~/.hermes/plugins/superpowers
            hermes plugins enable superpowers 2>&1 | tail -3 || true
          fi
          if hermes plugins list 2>/dev/null | grep -qi superpowers; then
            echo '✅ Superpowers plugin installed (obra/superpowers, enabled)'
          else
            echo '⚠️ Superpowers NOT in `hermes plugins list` — check install output above'
          fi

          # 5. Write the mcp_servers block into ~/.hermes/config.yaml.
          #    Appended only if not already present.
          if ! grep -q "mcp_servers" ~/.hermes/config.yaml; then
            # Build the PostGIS connection string from h-dashboard's .env (creds are static there).
            HD_ENV=/home/runner/h-dashboard/.env
            if [ -f "$HD_ENV" ]; then
              PG_HOST=$(grep -E '^DB_HOST=' "$HD_ENV" | cut -d= -f2-)
              PG_PORT=$(grep -E '^DB_PORT=' "$HD_ENV" | cut -d= -f2-)
              PG_DB=$(grep -E '^DB_DATABASE=' "$HD_ENV" | cut -d= -f2-)
              PG_USER=$(grep -E '^DB_USERNAME=' "$HD_ENV" | cut -d= -f2-)
              PG_PASS=$(grep -E '^DB_PASSWORD=' "$HD_ENV" | cut -d= -f2-)
              PG_URL="postgresql://${PG_USER}:***@${PG_HOST}:${PG_PORT}/${PG_DB}"
            else
              PG_URL="postgresql://h_dashboard:***@127.0.0.1:5432/h_dashboard"
            fi
            printf '\nmcp_servers:\n  laravel-boost:\n    command: php\n    args: ["artisan", "boost:mcp"]\n    cwd: /home/runner/h-dashboard\n  postgis:\n    command: uvx\n    args: ["mcp-postgis"]\n    env:\n      MCP_POSTGIS_DATABASE_URL: "%s"\n      MCP_POSTGIS_MODE: read_only\n  github:\n    command: npx\n    args: ["-y", "@modelcontextprotocol/server-github"]\n    env:\n      GITHUB_PERSONAL_ACCESS_TOKEN: "%s"\n    timeout: 120\n    connect_timeout: 60\n' "$PG_URL" "$GH_TOKEN" >> ~/.hermes/config.yaml
            echo '✅ Appended mcp_servers (laravel-boost + postgis + github) to config.yaml'
          else
            echo '✅ mcp_servers already present in config.yaml'
          fi

          # 7. (Removed) The Hermes messaging gateway is no longer started:
          #    it only served the Telegram connection, which was removed at
          #    Mehdi's request. The seed warmup that sent its result to
          #    Telegram went with it. Hermes itself stays installed above
          #    (CLI + MCPs); access to this instance is via SSH and the
          #    OpenCode server started in step 13b.

      - name: 13b. Install OpenCode, set default model & start opencode serve
        env:
          OPENCODE_SERVER_PASSWORD: ${{ secrets.RUNNER_PASSWORD }}
        run: |
          # 1. Install OpenCode (npm package opencode-ai) — same npm-global
          #    pattern as CodeGraph/9router, plus the /usr/local/bin symlink.
          npm install -g opencode-ai
          if [ -f ~/.npm-global/bin/opencode ]; then
            sudo ln -sf ~/.npm-global/bin/opencode /usr/local/bin/opencode
            echo "✅ OpenCode installed: $(opencode --version)"
          else
            echo '⚠️ opencode binary not found after installation'
          fi

          # 2. Global config: default model = the free OpenCode Zen model
          #    mimo-v2.6-flash-free (full id: opencode/mimo-v2.6-flash-free).
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "opencode/mimo-v2.6-flash-free"
          }
          JSON
          echo '✅ OpenCode default model set to opencode/mimo-v2.6-flash-free'

          # 3. Start opencode serve in the background on 0.0.0.0:4096 so it
          #    is reachable over Tailscale. HTTP Basic Auth comes from the
          #    OPENCODE_SERVER_PASSWORD step env (= RUNNER_PASSWORD secret);
          #    the username defaults to "opencode".
          cd /home/runner/h-dashboard
          nohup opencode serve --hostname 0.0.0.0 --port 4096 > /tmp/opencode.log 2>&1 &
          sleep 6
          if curl -fsS -u "opencode:${OPENCODE_SERVER_PASSWORD}" http://localhost:4096/global/health > /dev/null 2>&1; then
            echo '✅ opencode serve is live on http://localhost:4096 (basic auth: opencode / RUNNER_PASSWORD)'
          else
            echo '⚠️ opencode serve did not come up — check /tmp/opencode.log'
          fi

      - name: 14. Start Laravel Development Server
        run: |
          cd /home/runner/h-dashboard
          nohup php artisan serve --host=0.0.0.0 > /dev/null 2>&1 &
          echo '✅ Laravel server started on port 8000'

      - name: 15. Server Keep-Alive (5h 40m)
        run: |
          for i in {1..340}; do
            sleep 60
            echo "[$i/340] Server is active (SSH + Laravel :8000 + OpenCode :4096)..."
          done

      - name: 16. Sync hermes state & 9router data back to my-op1
        if: always()
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          cd "${GITHUB_WORKSPACE:-.}"
          git config user.name "haileen5"
          git config user.email "haileen5@users.noreply.github.com"
          # Authenticate with PAT for push
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/haileen5/my-op1.git"

          H=/home/runner/.hermes
          HDEST=hermes

          # 1. Copy all dynamic hermes dirs & files back to repo
          mkdir -p "$HDEST"
          for item in memories skills cron hooks platforms sessions kanban plugins; do
            [ -d "$H/$item" ] && cp -r "$H/$item" "$HDEST/"
          done
          for f in SOUL.md kanban.db state.db channel_directory.json \
                   gateway_state.json .skills_prompt_snapshot.json; do
            [ -f "$H/$f" ] && cp "$H/$f" "$HDEST/"
          done
          # General guard — never sync back a plugin that is itself a git
          # repo (anything installed via `hermes plugins install` is one,
          # superpowers included). cp -r + `git add hermes/` would record
          # such a dir as a gitlink (mode 160000) with no .gitmodules, and
          # the NEXT run's checkout step dies in its 'Removing auth' phase:
          #   fatal: No url found for submodule path
          #   'hermes/plugins/<name>' in .gitmodules
          # That is exactly what broke my-syd. Git-repo plugins are upstream
          # code: re-install them in step 13 (like superpowers, §4e) instead
          # of backing them up. Plain-file plugins (no .git) sync as before.
          if [ -d "$HDEST/plugins" ]; then
            for p in "$HDEST/plugins"/*/; do
              if [ -e "${p}.git" ]; then
                echo "🧹 Excluding git-repo plugin from sync: $p"
                rm -rf "$p"
              fi
            done
          fi
          echo '✅ Copied hermes dynamic state → hermes/ for backup'

          # 2. Copy 9router database back to repo
          mkdir -p 9router
          if [ -f ~/.9router/db/data.sqlite ]; then
            cp ~/.9router/db/data.sqlite 9router/data.sqlite
            echo '✅ Copied 9router data.sqlite → 9router/ for backup'
          fi

          # 3. Commit & push if anything changed
          if git diff --quiet && git diff --cached --quiet; then
            echo 'ℹ️ No changes to commit'
          else
            git add hermes/ 9router/ 2>/dev/null || true
            git commit -m "Sync hermes state & 9router data from open1 instance"
            # Pull first in case another run pushed before us
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push origin "${{ github.ref_name }}" || echo '⚠️ Push failed — changes saved locally'
            echo '✅ Hermes & 9router data synced to my-op1'
          fi

      - name: 17. Tailscale Logout (cleanup on shutdown)
        if: always()
        run: |
          sudo tailscale logout || true
          echo "✅ Tailscale logout executed — hostname freed"
